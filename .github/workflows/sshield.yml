name: sshield

on:
  push:
    paths: ["sshield/**", ".github/workflows/sshield.yml"]
  pull_request:
    paths: ["sshield/**", ".github/workflows/sshield.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: sshield

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sshield
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo test --workspace
      - run: cargo build --release -p sshield
      - uses: actions/upload-artifact@v4
        with:
          name: sshield-${{ matrix.os }}
          path: |
            sshield/target/release/sshield
            sshield/target/release/sshield.exe
          if-no-files-found: ignore
