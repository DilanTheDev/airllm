[package]
name = "sshield-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
dirs = "7.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
if-addrs = "0.15.0"
russh = { version = "0.65.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
zeroize = "1.9.1"

[dev-dependencies]
tokio-test = "0.4.6"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock"] }

[features]
# Test/demo support: an in-process SFTP server backed by a sandbox directory.
devserver = []

[dev-dependencies.sshield-core]
path = "."
features = ["devserver"]
